<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Imagine3D — effect contact sheet</title>
  <style>
    body { margin: 0; background: #0b0d12; color: #e6ebf5;
           font: 13px "Segoe UI", system-ui, sans-serif; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 12px; }
    #status { color: #8792a8; margin-bottom: 12px; }
    #sheet { max-width: 100%; border: 1px solid #262d3d; border-radius: 8px; }
    .controls { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
    button, select { font: inherit; background: #1b2130; color: inherit;
                     border: 1px solid #262d3d; border-radius: 6px; padding: 6px 12px; }
  </style>
</head>
<body>
  <h1>Effect contact sheet</h1>
  <div class="controls">
    <select id="kind">
      <option value="all">all kinds</option>
      <option value="scene2d">scene2d</option>
      <option value="raymarch">raymarch</option>
      <option value="scene3d">scene3d</option>
      <option value="post">post</option>
      <option value="transition">transition</option>
    </select>
    <select id="palette"></select>
    <button id="go">Render sheet</button>
    <button id="upload">Save to disk</button>
  </div>
  <div id="status">idle</div>
  <canvas id="sheet"></canvas>
  <canvas id="work" style="display:none"></canvas>
  <script type="module" src="ui/preview.js"></script>
</body>
</html>
